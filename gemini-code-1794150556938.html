<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annie | Hair Stylist - Agendamento</title>
    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Biblioteca Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap');

        :root {
            --bg-dark: #0a0609;
            --bg-card: rgba(23, 16, 21, 0.75);
            --rose-primary: #ff75a0;
            --rose-light: #ffb3cc;
            --rose-dark: #c94f78;
            --neon-glow: 0 0 10px rgba(255, 117, 160, 0.7), 0 0 20px rgba(255, 117, 160, 0.4), 0 0 35px rgba(255, 117, 160, 0.2);
            --text-main: #f9f6f8;
            --text-muted: #d0c2c8;
            --border-neon: rgba(255, 117, 160, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 15px;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(201, 79, 120, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(10, 6, 9, 0.9) 0%, #0a0609 100%);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-neon);
            border-radius: 32px;
            padding: 40px 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), var(--neon-glow);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #251820, #140d12);
            border: 2px solid var(--rose-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--neon-glow), inset 0 0 15px rgba(255, 117, 160, 0.3);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-placeholder {
            color: var(--rose-light);
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 0 0 8px rgba(255, 179, 204, 0.6);
            text-align: center;
        }

        .brand-header {
            width: 100%;
            text-align: center;
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-title {
            font-family: 'Jost', sans-serif;
            font-size: 2.8rem;
            font-weight: 400;
            color: var(--text-main);
            letter-spacing: 8px;
            margin-bottom: 0px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
            transform: translateX(4px); 
        }

        .brand-subtitle {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: var(--rose-primary);
            line-height: 1;
            text-shadow: 0 0 12px rgba(255, 117, 160, 0.6);
            margin-top: -2px;
        }

        .btn-luxury {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--rose-primary), var(--rose-dark));
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 117, 160, 0.4), 0 0 15px rgba(255, 117, 160, 0.3);
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-luxury:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--rose-primary);
            color: var(--rose-light);
            margin-top: 12px;
            box-shadow: 0 0 10px rgba(255, 117, 160, 0.2);
        }

        .btn-special {
            background: linear-gradient(135deg, #3d1f2b, #25121a);
            border: 1px solid var(--rose-primary);
            color: var(--rose-light);
            margin-top: 15px;
            box-shadow: 0 0 12px rgba(255, 117, 160, 0.3);
            font-size: 0.9rem;
        }

        .screen {
            width: 100%;
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spots-container {
            margin-top: 15px;
            text-align: left;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .spots-container::-webkit-scrollbar {
            width: 4px;
        }
        .spots-container::-webkit-scrollbar-thumb {
            background: var(--rose-dark);
            border-radius: 4px;
        }

        .day-accordion {
            background: rgba(32, 21, 28, 0.8);
            border: 1px solid rgba(255, 117, 160, 0.3);
            border-radius: 12px;
            margin-bottom: 10px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .day-accordion.active {
            border-color: var(--rose-primary);
            box-shadow: 0 0 12px rgba(255, 117, 160, 0.3);
        }

        .day-header {
            width: 100%;
            padding: 14px 18px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-header span {
            color: var(--rose-primary);
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        .day-accordion.active .day-header span {
            transform: rotate(180deg);
        }

        .day-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease;
            padding: 0 16px;
            background: rgba(25, 16, 22, 0.9);
        }

        .day-accordion.active .day-content {
            max-height: 250px;
            padding: 12px 16px 16px 16px;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .slot-btn {
            background: #251820;
            border: 1px solid rgba(255, 117, 160, 0.3);
            color: var(--text-main);
            padding: 10px 6px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .slot-btn:hover {
            background: var(--rose-primary);
            color: #ffffff;
            border-color: var(--rose-light);
            box-shadow: 0 0 12px var(--rose-primary);
        }

        .form-group {
            margin-top: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(32, 21, 28, 0.9);
            border: 1px solid rgba(255, 117, 160, 0.4);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--rose-primary);
            box-shadow: 0 0 10px rgba(255, 117, 160, 0.4);
        }

        .selected-info {
            background: rgba(32, 21, 28, 0.9);
            border: 1px dashed var(--rose-primary);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--rose-light);
            text-align: center;
        }

        .whatsapp-notice {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 15px;
            line-height: 1.4;
            font-style: italic;
            text-align: center;
        }

        .admin-footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <span class="logo-placeholder">LOGO / FOTO</span>
        </div>

        <div class="brand-header">
            <h1 class="brand-title">Annie</h1>
            <div class="brand-subtitle">Hair Stylist</div>
        </div>

        <!-- TELA 1: HOME -->
        <div id="home-screen" class="screen active">
            <button class="btn-luxury" onclick="goToScreen('booking-screen')">Agendar Atendimento</button>
            <div class="admin-footer" onclick="openAdminPanel()">⚙️ Acesso Profissional</div>
        </div>

        <!-- TELA 2: ESCOLHA DE HORÁRIOS -->
        <div id="booking-screen" class="screen">
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 12px; text-align: left;">Selecione o dia desejado:</p>
            
            <div class="spots-container" id="spots-list">
                <!-- Preenchido via JS com datas a partir de 09/11/2026 -->
            </div>

            <button class="btn-luxury btn-special" onclick="alert('Aguardar disponibilidade')">✨ Reserva para o fim do ano</button>
            <button class="btn-luxury btn-secondary" onclick="goToScreen('home-screen')">Voltar</button>
        </div>

        <!-- TELA 3: DADOS DO CLIENTE -->
        <div id="form-screen" class="screen">
            <div class="selected-info" id="selected-slot-display">
                Horário selecionado
            </div>

            <div class="form-group">
                <label for="client-name">Seu Nome Completo</label>
                <input type="text" id="client-name" class="form-input" placeholder="Digite seu nome">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label for="client-phone">Seu WhatsApp (com DDD)</label>
                <input type="tel" id="client-phone" class="form-input" placeholder="Ex: 79 99999-9999">
            </div>

            <button class="btn-luxury" onclick="confirmBooking()">Confirmar Agendamento</button>
            <button class="btn-luxury btn-secondary" onclick="goToScreen('booking-screen')">Escolher Outro Horário</button>

            <div class="whatsapp-notice">
                * Ao confirmar, você será direcionado para o WhatsApp para concluir o atendimento.<br>
                <strong>Precisa cancelar ou remarcar?</strong> Informe diretamente no WhatsApp da Annie.
            </div>
        </div>
    </div>

    <script>
        // Credenciais do Supabase configuradas com sucesso
        const SUPABASE_URL = "https://fifkfhqjvzqywgewsuiy.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_rjCDpJ4Ft4u196tKwsOo4Q_Q7iXi6En";
        const WHATSAPP_ANNIE = "5579981350204";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let selectedAppointment = { dateKey: "", dayName: "", time: "" };
        let bookedSlotsCache = [];

        function goToScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'booking-screen') {
                loadAvailableSpots();
            }
        }

        // Gera os próximos dias úteis/sábados a partir de 09/11/2026
        function generateScheduleDays() {
            let days = [];
            let currentDate = new Date(2026, 10, 9); // 9 de Novembro de 2026
            
            let count = 0;
            while(count < 6) { 
                let dayOfWeek = currentDate.getDay(); 
                
                if (dayOfWeek !== 0) { // Pula domingo
                    let dayNames = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
                    let slots = (dayOfWeek === 6) ? ["14:00", "15:00", "16:00", "17:00"] : ["17:30", "18:30", "19:30"];
                    
                    let dayNum = String(currentDate.getDate()).padStart(2, '0');
                    let monthNum = String(currentDate.getMonth() + 1).padStart(2, '0');
                    let dateFormatted = `${dayNum}/${monthNum}`;
                    let dateKey = `${currentDate.getFullYear()}-${monthNum}-${dayNum}`;

                    days.push({
                        title: `${dayNames[dayOfWeek]} - ${dateFormatted}`,
                        dateKey: dateKey,
                        slots: slots
                    });
                    count++;
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
            return days;
        }

        async function loadAvailableSpots() {
            const container = document.getElementById('spots-list');
            container.innerHTML = "<p style='color: var(--text-muted); font-size:0.9rem; text-align:center;'>Carregando horários...</p>";

            const { data, error } = await supabaseClient.from('agendamentos').select('*');
            bookedSlotsCache = data || [];

            const scheduleData = generateScheduleDays();
            container.innerHTML = "";

            scheduleData.forEach((item, index) => {
                const accordion = document.createElement('div');
                accordion.className = 'day-accordion';
                if (index === 0) accordion.classList.add('active');

                const header = document.createElement('button');
                header.className = 'day-header';
                header.innerHTML = `${item.title} <span>▼</span>`;
                header.onclick = () => {
                    const activeAcc = document.querySelector('.day-accordion.active');
                    if (activeAcc && activeAcc !== accordion) activeAcc.classList.remove('active');
                    accordion.classList.toggle('active');
                };

                const content = document.createElement('div');
                content.className = 'day-content';

                const slotsGrid = document.createElement('div');
                slotsGrid.className = 'slots-grid';

                item.slots.forEach(time => {
                    const isBooked = bookedSlotsCache.some(b => b.data_agendamento === item.dateKey && b.horario === time);

                    if (!isBooked) {
                        const slotBtn = document.createElement('button');
                        slotBtn.className = 'slot-btn';
                        slotBtn.innerText = time;
                        slotBtn.onclick = () => selectSlot(item.title, item.dateKey, time);
                        slotsGrid.appendChild(slotBtn);
                    }
                });

                if (slotsGrid.children.length === 0) {
                    slotsGrid.innerHTML = "<p style='grid-column: span 3; color: var(--rose-light); font-size: 0.8rem; text-align:center;'>Esgotado para esta data</p>";
                }

                content.appendChild(slotsGrid);
                accordion.appendChild(header);
                accordion.appendChild(content);
                container.appendChild(accordion);
            });
        }

        function selectSlot(dayTitle, dateKey, time) {
            selectedAppointment = { dateKey: dateKey, dayName: dayTitle, time: time };
            document.getElementById('selected-slot-display').innerText = `${dayTitle} às ${time}`;
            goToScreen('form-screen');
        }

        async function confirmBooking() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();

            if (!name || !phone) {
                alert("Por favor, preencha seu nome e telefone para prosseguir.");
                return;
            }

            const { error } = await supabaseClient.from('agendamentos').insert([
                { data_agendamento: selectedAppointment.dateKey, horario: selectedAppointment.time, cliente_nome: name, cliente_telefone: phone }
            ]);

            if (error) {
                alert("Este horário acabou de ser reservado por outra pessoa. Por favor, escolha outro.");
                loadAvailableSpots();
                goToScreen('booking-screen');
                return;
            }

            const message = `✨ *Novo atendimento - Annie Hair Stylist* ✨\n\n` +
                            `👤 *Cliente:* ${name}\n` +
                            `📱 *Telefone:* ${phone}\n` +
                            `📅 *Dia:* ${selectedAppointment.dayName}\n` +
                            `⏰ *Horário:* ${selectedAppointment.time}\n\n` +
                            `*(Detalhes adicionais serão alinhados por aqui)*`;

            const whatsappUrl = `https://wa.me/${WHATSAPP_ANNIE}?text=${encodeURIComponent(message)}`;
            window.location.href = whatsappUrl;
        }

        // Painel Secreto da Annie
        async function openAdminPanel() {
            let pass = prompt("Digite a senha de acesso profissional:");
            if (pass !== "annie123") {
                if(pass !== null) alert("Senha incorreta.");
                return;
            }

            const { data, error } = await supabaseClient.from('agendamentos').select('*').order('data_agendamento', { ascending: true });
            if (error || !data || data.length === 0) {
                alert("Não há agendamentos ativos no momento.");
                return;
            }

            let listStr = "AGENDAMENTOS ATIVOS (Escolha para liberar):\n\n";
            data.forEach((item, idx) => {
                listStr += `[${idx + 1}] Data: ${item.data_agendamento} | ${item.horario}\nCliente: ${item.cliente_nome} (${item.cliente_telefone})\n-------------------\n`;
            });

            let escolha = prompt(listStr + "\nDigite o número do atendimento que deseja CANCELAR/LIBERAR o horário:");
            if (escolha) {
                let indexNum = parseInt(escolha) - 1;
                if (data[indexNum]) {
                    let agendamentoParaApagar = data[indexNum];
                    let confirma = confirm(`Deseja realmente liberar o horário de ${agendamentoParaApagar.cliente_nome} (${agendamentoParaApagar.data_agendamento} às ${agendamentoParaApagar.horario})?`);
                    if (confirma) {
                        await supabaseClient.from('agendamentos').delete().eq('id', agendamentoParaApagar.id);
                        alert("Horário liberado com sucesso! Ele já está disponível novamente no site.");
                    }
                } else {
                    alert("Opção inválida.");
                }
            }
        }
    </script>
</body>
</html>
